<html>
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-F15PE2MDCX"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-F15PE2MDCX');
  </script>
  <title>Realidad Aumentada Tetris</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v6.1.1/dist/aframe-extras.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const sceneEl = document.querySelector('a-scene');
      sceneEl.addEventListener('loaded', () => {
        for (let i = 0; i < 5; i++) {
          let entityEl = document.createElement('a-entity');
          entityEl.setAttribute('mindar-image-target', `targetIndex: ${i}`);
          entityEl.innerHTML = '<a-plane src="#card" position="0 0 0" height="1.5" width="1" rotation="0 0 0"></a-plane>';
          sceneEl.appendChild(entityEl);
        }
      });
    });
  </script>
</head>
<body>
<a-scene mindar-image="imageTargetSrc: ./targets3.mind;" color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights"
         vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
  <a-assets>
    <img id="card" src="./make_software.jpg" />
  </a-assets>

  <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
</a-scene>
</body>
</html>
