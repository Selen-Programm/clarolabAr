<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pasantía </title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/aframe-gif-shader@0.9.1/dist/aframe-gif-shader.min.js"></script>
</head>
<body>
  <a-scene 
    mindar-image="imageTargetSrc: ./targets1.mind;" 
    color-space="sRGB" 
    renderer="colorManagement: true, physicallyCorrectLights" 
    vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false">
    
    <a-assets>
      <img id="pet1" src="./images/6.png" />
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity mindar-image-target="targetIndex: 0">
      <a-plane position="0.4 0.4 0.1" scale="1.5 1.5 1.5" material="shader: gif; src: url(./images/puerta-small/Mascota_Giro.gif); transparent: true;"></a-plane>
      <a-image src="#pet1" position="-0.2 0 0.1" height="1.5" width="1"></a-image>
    </a-entity>

  </a-scene>
</body>
</html>
